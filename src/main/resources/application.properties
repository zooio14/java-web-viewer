server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-message=never
server.error.include-stacktrace=never
server.max-http-request-header-size=16KB

# Domínios e seus subdomínios. Não aceita wildcard ou sufixo público.
viewer.allowed-domains=${VIEWER_ALLOWED_DOMAINS:wikipedia.org,example.com,developer.mozilla.org}
# public permite qualquer domínio público para usuários autenticados, com os mesmos bloqueios de IP.
viewer.destination-mode=${VIEWER_DESTINATION_MODE:public}
# Vazio/curto mantém o acesso remoto fechado; nunca embutir um segredo na imagem.
viewer.access-token=${VIEWER_ACCESS_TOKEN:}
viewer.max-sessions=${VIEWER_MAX_SESSIONS:2}
viewer.idle-timeout-seconds=${VIEWER_IDLE_TIMEOUT_SECONDS:300}
viewer.session-max-seconds=${VIEWER_SESSION_MAX_SECONDS:1800}
viewer.fps=${VIEWER_FPS:8}
viewer.jpeg-quality=${VIEWER_JPEG_QUALITY:70}
viewer.chromium-sandbox=${VIEWER_CHROMIUM_SANDBOX:true}
